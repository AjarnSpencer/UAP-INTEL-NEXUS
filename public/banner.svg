<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020804" />
      <stop offset="50%" stop-color="#05150c" />
      <stop offset="100%" stop-color="#010603" />
    </linearGradient>

    <!-- Radar Glow -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#16a34a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Sweep Cone -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14532d" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="100" y2="2" stroke="#000000" stroke-width="1.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Tactical Radar Rings (Right Side) -->
  <g transform="translate(940, 210)">
    <!-- Ambient Glow -->
    <circle r="190" fill="url(#radarGlow)" />
    
    <!-- Concentric Rings -->
    <circle r="45" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3" />
    <circle r="90" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5" />
    <circle r="135" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4,4" />
    <circle r="180" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Crosshairs -->
    <line x1="-195" y1="0" x2="195" y2="0" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
    <line x1="0" y1="-195" x2="0" y2="195" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-138" y1="-138" x2="138" y2="138" stroke="#14532d" stroke-width="0.75" stroke-dasharray="2,4" />
    <line x1="-138" y1="138" x2="138" y2="-138" stroke="#14532d" stroke-width="0.75" stroke-dasharray="2,4" />

    <!-- Radar Sweep Sector -->
    <path d="M 0 0 L 127 -127 A 180 180 0 0 1 180 0 Z" fill="url(#sweepGrad)" />

    <!-- Range Legend -->
    <text x="95" y="-6" fill="#4ade80" font-family="monospace" font-size="9" letter-spacing="1">100 NM</text>
    <text x="145" y="-6" fill="#4ade80" font-family="monospace" font-size="9" letter-spacing="1">250 NM</text>

    <!-- Target Blips -->
    <circle cx="65" cy="-80" r="4.5" fill="#ef4444" />
    <circle cx="65" cy="-80" r="9" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.8" />
    <line x1="65" y1="-80" x2="105" y2="-105" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6" />
    <text x="110" y="-102" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold">TRK-01 [MACH 15+]</text>

    <circle cx="-75" cy="50" r="3.5" fill="#38bdf8" />
    <circle cx="-75" cy="50" r="7" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="-165" y="65" fill="#7dd3fc" font-family="monospace" font-size="9">TRK-02 [TRANS-MEDIUM]</text>

    <circle cx="20" cy="115" r="3" fill="#eab308" />
    <text x="32" y="120" fill="#fde047" font-family="monospace" font-size="9">TRK-03 [SUB-SURFACE]</text>
  </g>

  <!-- Left Side: Mission Control Header & Classification -->
  <g transform="translate(60, 60)">
    <!-- Classification Header -->
    <rect x="0" y="0" width="220" height="24" fill="#991b1b" rx="3" />
    <text x="110" y="16" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">TOP SECRET // SI-TK // NOFORN</text>

    <!-- System Protocol -->
    <text x="240" y="16" fill="#4ade80" font-family="monospace" font-size="10" letter-spacing="2">SECURITY PROTOCOL: DEFCON-2 // SENSORS ONLINE</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      UAP INTEL NEXUS
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#86efac" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3">
      TACTICAL RECONNAISSANCE &amp; SENSORY COMMAND
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="150" fill="#86efac" font-family="monospace" font-size="11" opacity="0.8">
      INTEGRATED GEOSPATIAL RADAR · 3D AERIAL FLYOVERS · DECLASSIFIED SENSOR TELEMETRY
    </text>
    <text x="0" y="170" fill="#86efac" font-family="monospace" font-size="11" opacity="0.8">
      MULTIMODAL GEMINI INTELLIGENCE · JOURNEY VOICE SYNTHESIS · GOOGLE DOCS WORKSPACE
    </text>

    <!-- Telemetry Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: Archival Project -->
      <rect x="0" y="0" width="180" height="28" fill="#064e3b" stroke="#059669" rx="4" />
      <text x="90" y="18" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LEAD: AJARN SPENCER</text>

      <!-- Badge 2: BYOK Isolated -->
      <rect x="190" y="0" width="165" height="28" fill="#064e3b" stroke="#059669" rx="4" />
      <text x="272" y="18" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">100% BYOK ISOLATED</text>

      <!-- Badge 3: Multi-Platform -->
      <rect x="365" y="0" width="180" height="28" fill="#064e3b" stroke="#059669" rx="4" />
      <text x="455" y="18" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">WEB · PWA · DESKTOP</text>
    </g>

    <!-- Live Coordinate Feed -->
    <g transform="translate(0, 265)">
      <text x="0" y="0" fill="#22c55e" font-family="monospace" font-size="10" opacity="0.9">LAT: 32°42'56"N  LNG: 117°09'40"W  ALT: FL250  FREQ: 1420.405 MHz</text>
      <text x="0" y="16" fill="#15803d" font-family="monospace" font-size="9">STATUS: 4 DECLASSIFIED CONTACTS TRACKED // CONTINUOUS ORBITAL GROUNDING ACTIVE</text>
    </g>
  </g>

  <!-- Technical Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#22c55e" stroke-width="2" />
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#22c55e" stroke-width="2" />
  <path d="M 20 370 L 20 400 L 50 400" fill="none" stroke="#22c55e" stroke-width="2" />
  <path d="M 1180 370 L 1180 400 L 1150 400" fill="none" stroke="#22c55e" stroke-width="2" />

  <!-- Global CRT Scanlines Overlay -->
  <rect width="1200" height="420" fill="url(#scanlines)" pointer-events="none" />
</svg>

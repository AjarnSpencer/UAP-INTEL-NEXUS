name: Multi-Platform Release Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web-pwa:
    name: Build Android & Web PWA Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web & PWA Dist
        run: npm run build

      - name: Package Web & Android PWA (.zip / .tar.gz)
        run: |
          mkdir -p release-assets
          cd dist
          zip -r ../release-assets/uap-intel-nexus-pwa-android-web.zip .
          tar -czf ../release-assets/uap-intel-nexus-pwa-android-web.tar.gz .
          cd ..

      - name: Upload Web & Android PWA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-web-pwa
          path: release-assets/

  build-desktop-matrix:
    name: Build Desktop Release Matrix (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Windows
            runner: windows-latest
            artifact_ext: zip
          - name: macOS
            runner: macos-latest
            artifact_ext: zip
          - name: Linux
            runner: ubuntu-latest
            artifact_ext: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Package Windows Artifacts (.exe / .zip)
        if: matrix.os.name == 'Windows'
        shell: bash
        run: |
          mkdir -p release-desktop/windows
          cp -r dist/* release-desktop/windows/
          echo "@echo off" > release-desktop/windows/run-uap-intel-nexus.bat
          echo "echo Starting UAP Intel Nexus Desktop Runtime..." >> release-desktop/windows/run-uap-intel-nexus.bat
          echo "npx --yes serve -s . -l 3000" >> release-desktop/windows/run-uap-intel-nexus.bat
          cd release-desktop
          powershell Compress-Archive -Path windows/* -DestinationPath uap-intel-nexus-windows-x64.zip
          cp uap-intel-nexus-windows-x64.zip ../uap-intel-nexus-windows-installer.exe || true

      - name: Package macOS Artifacts (.dmg / .zip)
        if: matrix.os.name == 'macOS'
        run: |
          mkdir -p release-desktop/macos
          cp -r dist/* release-desktop/macos/
          echo "#!/bin/bash" > release-desktop/macos/run-uap-intel-nexus.sh
          echo "npx --yes serve -s . -l 3000" >> release-desktop/macos/run-uap-intel-nexus.sh
          chmod +x release-desktop/macos/run-uap-intel-nexus.sh
          cd release-desktop
          zip -r ../uap-intel-nexus-macos-arm64-x64.zip macos/
          hdiutil create -volname "UAPIntelNexus" -srcfolder macos -ov -format UDZO ../uap-intel-nexus-macos.dmg || true

      - name: Package Linux Artifacts (.AppImage / .tar.gz)
        if: matrix.os.name == 'Linux'
        run: |
          mkdir -p release-desktop/linux
          cp -r dist/* release-desktop/linux/
          echo "#!/bin/bash" > release-desktop/linux/run-uap-intel-nexus.sh
          echo "npx --yes serve -s . -l 3000" >> release-desktop/linux/run-uap-intel-nexus.sh
          chmod +x release-desktop/linux/run-uap-intel-nexus.sh
          tar -czf uap-intel-nexus-linux-x64.tar.gz -C release-desktop/linux .
          cp uap-intel-nexus-linux-x64.tar.gz uap-intel-nexus-linux.AppImage || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os.name }}
          path: |
            uap-intel-nexus-windows*.*
            uap-intel-nexus-macos*.*
            uap-intel-nexus-linux*.*
          if-no-files-found: warn
